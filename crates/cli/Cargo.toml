[package]
name = "archaeologus-cli"
version.workspace = true
edition.workspace = true
default-run = "archaeologus"

[lib]
name = "archaeologus_cli"
path = "src/lib.rs"

[[bin]]
name = "archaeologus"
path = "src/main.rs"

[dependencies]
archaeologus-core = { workspace = true }
archaeologus-db = { workspace = true }
archaeologus-git = { workspace = true }
archaeologus-indexer = { workspace = true }
archaeologus-evidence = { workspace = true }
archaeologus-search = { workspace = true }
archaeologus-api = { workspace = true }
archaeologus-mcp = { workspace = true }
archaeologus-llm = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
git2 = { workspace = true }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
