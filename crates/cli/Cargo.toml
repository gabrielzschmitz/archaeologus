[package]
name = "archaeologist-cli"
version.workspace = true
edition.workspace = true
default-run = "archaeologist"

[lib]
name = "archaeologist_cli"
path = "src/lib.rs"

[[bin]]
name = "archaeologist"
path = "src/main.rs"

[dependencies]
archaeologist-core = { workspace = true }
archaeologist-db = { workspace = true }
archaeologist-git = { workspace = true }
archaeologist-indexer = { workspace = true }
archaeologist-evidence = { workspace = true }
archaeologist-search = { workspace = true }
archaeologist-api = { workspace = true }
archaeologist-mcp = { workspace = true }
archaeologist-llm = { workspace = true }
rmcp = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
git2 = { workspace = true }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
