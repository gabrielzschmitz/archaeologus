[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
archaeologist-core = { path = "crates/core" }
archaeologist-db = { path = "crates/db" }
archaeologist-git = { path = "crates/git" }
archaeologist-indexer = { path = "crates/indexer" }
archaeologist-search = { path = "crates/search" }
archaeologist-evidence = { path = "crates/evidence" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Date-time
jiff = { version = "0.2", features = ["serde"] }

# HTTP client (for future use)
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Database
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "json",
    "chrono",
] }

# Git
git2 = { version = "0.21", features = ["https", "vendored-openssl", "vendored-libgit2"] }

# Code parsing
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Parallelism
rayon = "1.10"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
regex = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "warn"
