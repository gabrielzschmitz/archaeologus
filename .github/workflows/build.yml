name: Build

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  FIXTURES_VERSION: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: archaeologus
          POSTGRES_PASSWORD: archaeologus_dev
          POSTGRES_DB: archaeologus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U archaeologus -d archaeologus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets
        env:
          DATABASE_URL: postgres://archaeologus:archaeologus_dev@localhost:5432/archaeologus

      - name: Run migrations
        run: cargo run -- migrate
        env:
          DATABASE_URL: postgres://archaeologus:archaeologus_dev@localhost:5432/archaeologus

      - name: Clone test fixtures
        run: git clone --branch "$FIXTURES_VERSION" https://github.com/arypog/fixtures.git /tmp/archaeologus-fixtures

      - name: Run tests
        run: cargo test --workspace -- --include-ignored
        env:
          DATABASE_URL: postgres://archaeologus:archaeologus_dev@localhost:5432/archaeologus

      - name: Build release
        run: cargo build --release